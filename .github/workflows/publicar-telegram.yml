name: Publicar ofertas en Telegram

on:
  schedule:
    - cron: '*/15 6-20 * * *'

permissions:
  contents: write

concurrency:
  group: ofertas-telegram-cola
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias del programador
        run: python -m pip install requests schedule pytz
      - name: Publicar si hay una franja pendiente
        run: python publicar_siguiente.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_ACTIONS: 'true'
      - name: Guardar cola e historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cola.json estado_publicacion.json ofertas.json
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualiza cola e historial de ofertas"
            git push
          fi
