name: Añadir producto a la cola

on:
  workflow_dispatch:
    inputs:
      titulo:
        description: Título del producto
        required: true
        type: string
      url:
        description: Enlace directo del producto en Amazon.es
        required: true
        type: string
      precio:
        description: Precio que se mostrará (opcional)
        required: false
        type: string
      imagen:
        description: URL de la imagen (opcional)
        required: false
        type: string
      categoria:
        description: Categoría
        required: true
        type: choice
        options:
          - hogar
          - tecnologia
          - deporte
          - moda
          - infantil
        default: hogar

permissions:
  contents: write

concurrency:
  group: ofertas-telegram-cola
  cancel-in-progress: false

jobs:
  anadir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias del programador
        run: python -m pip install requests schedule pytz
      - name: Añadir el producto
        run: python anadir_producto.py
        env:
          INPUT_TITULO: ${{ inputs.titulo }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_PRECIO: ${{ inputs.precio }}
          INPUT_IMAGEN: ${{ inputs.imagen }}
          INPUT_CATEGORIA: ${{ inputs.categoria }}
      - name: Guardar la cola
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cola.json
          if git diff --cached --quiet; then
            echo "El producto ya estaba en la cola."
          else
            git commit -m "Añade producto a la cola"
            git push
          fi
